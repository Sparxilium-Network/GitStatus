# The service listens on 33444 and is published on the host loopback only.
# Expose it to GitHub through your own Cloudflare Tunnel pointing at http://localhost:33444
# (see docs/CLOUDFLARE-TUNNEL.md). Do not publish it on a public interface.
#
# Layout (this directory):
#   docker-compose.yml
#   config/config.conf
#   data/                       writable, owned by uid 10001
#   secrets/                    owned by uid 10001, chmod 400 files
#     github-app.pem
#     github-webhook-secret
#     discord-token
#
# Admin TUI:  docker compose exec bot java -jar /app/gitstatus.jar admin
services:
  bot:
    image: git-discord-notifier:0.1.0
    build:
      context: ..
    volumes:
      - ./config/config.conf:/config/config.conf:ro
      - ./data:/data
      - ./secrets:/run/secrets:ro
    ports:
      # Keep the 127.0.0.1 prefix: a published port bypasses ufw / firewalld.
      - "127.0.0.1:33444:33444"
    mem_limit: 512m
    restart: unless-stopped
