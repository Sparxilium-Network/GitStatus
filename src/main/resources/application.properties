spring.application.name=gitstatus
# System-level settings live in config.conf (mounted read-only at /config in Docker).
spring.config.import=optional:file:${GITSTATUS_CONFIG:/config/config.conf}[.properties]

# Defaults; override in config.conf
server.port=33444
database=/data/bot.db
github.apiUrl=https://api.github.com
# One sub-directory per GitHub App, named after the App ID: <App ID>/private-key.pem and <App ID>/webhook-secret
github.appsDir=/run/secrets/github-apps
# Single-App settings from earlier releases; still used when github.appId is set
github.appId=
github.privateKey=/run/secrets/github-app.pem
github.webhookSecret=/run/secrets/github-webhook-secret
discord.token=/run/secrets/discord-token
reload.intervalMs=5000
webhook.maxBodyBytes=10485760
# Source verification: only GitHub hook IP ranges (GET /meta) may deliver webhooks.
webhook.verifySource=true
webhook.sourceRefreshMs=21600000
# The real client IP header is trusted only from these peers (CIDRs, hostnames, or "gateway" =
# the container default gateway, i.e. connections arriving through the published host port).
webhook.clientIpHeader=CF-Connecting-IP
webhook.trustedProxies=gateway
deliveryLog.retentionDays=30

spring.datasource.url=jdbc:sqlite:${database}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true&transaction_mode=IMMEDIATE
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4

server.error.include-stacktrace=never
server.error.include-message=never
server.shutdown=graceful

logging.level.root=INFO
logging.level.net.dv8tion=WARN
logging.level.com.zaxxer.hikari=WARN
# e.g. [2026-10-30 20:29:56 WARN]: message
logging.pattern.console=[%d{yyyy-MM-dd HH:mm:ss} %level]: %msg%n
logging.pattern.file=[%d{yyyy-MM-dd HH:mm:ss} %level]: %msg%n
spring.sql.init.mode=never
